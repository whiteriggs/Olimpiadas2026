name: Actualitza el calendari

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Importa el full de càlcul
        run: python3 scripts/importar_calendario.py

      - name: Importa equips, quadres i punts
        run: python3 scripts/importar_torneig.py

      - name: Publica els canvis
        run: |
          if git diff --quiet data/; then
            echo "Sense canvis."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Actualitza dades des del full de càlcul"
          git push
